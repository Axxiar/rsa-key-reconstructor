<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSA Reconstructor</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="top-bar">
      <h1>🔑 Simple RSA Key Reconstructor</h1>
    </div>

    <section id="p-q">
        <div class="section-header">
            <h3>Primes p & q</h3>
            <button id="reset-first">Reset</button>
        </div>

        <label for="p">Prime p</label>
        <textarea id="p"></textarea>

        <label for="q">Prime q</label>
        <textarea id="q"></textarea>

        <button id="compute-key-params">Compute Key Parameters</button>
    </section>

    <section id="m-and-params">
        <div class="section-header">
            <h3>Modulus & Public Parameters</h3>
            <button id="reset-second">Reset</button>
        </div>

        <label for="n">N = p × q</label>
        <textarea id="n"></textarea>

        <label for="phi">Φ(N) = (p − 1)(q − 1)</label>
        <textarea id="phi"></textarea>

        <div class="inline">
            <label for="e">Public exponent (e)</label>
            <input type="number" id="e">

            <button id="compute-private">
                Compute & Export Private Key
            </button>
        </div>
    </section>

    <section id="results">
        <div class="section-header">
            <h3>Results</h3>
            <button id="reset-results">Reset</button>
        </div>

        <label for="d">Private exponent (d)</label>
        <textarea id="d"></textarea>

        <label for="private">Private Key (PKCS#8 PEM)</label>
        <textarea id="private" rows="16"></textarea>

        <label for="public">Public Key (PEM)</label>
        <textarea id="public" rows="16"></textarea>
    </section>

    <script type="module" src="index.js"></script>

</body>

</html>
